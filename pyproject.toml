[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-propensity"
version = "0.1.0"
description = "Customer segmentation with an out-of-time repeat-purchase propensity check on UCI Online Retail II"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.4.6",
    "pandas==2.3.2",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "statsmodels==0.14.5",
    "duckdb==1.4.2",
    "matplotlib==3.10.6",
    "pyyaml==6.0.2",
    "openpyxl==3.1.5",
    "threadpoolctl==3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/segmentation_propensity"]
branch = true

[tool.coverage.report]
show_missing = true
