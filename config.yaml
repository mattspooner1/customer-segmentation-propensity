# All project parameters. Paths are relative to this file's directory.
project:
  name: customer-segmentation-propensity
  seed: 20261104

paths:
  raw_dir: data/raw
  raw_zip: data/raw/online_retail_ii.zip
  raw_extract_dir: data/raw/extracted
  raw_csv: data/raw/online_retail_II.csv
  processed_dir: data/processed
  sql_dir: sql
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics
  results_json: outputs/metrics/results.json
  evidence_gate_md: outputs/metrics/evidence_gate.md
  segmentation_selection_json: outputs/metrics/segmentation_selection.json
  test_predictions_csv: data/processed/test_predictions.csv
  assumptions_yaml: assumptions.yaml

data:
  source_url: https://archive.ics.uci.edu/dataset/502/online+retail+ii
  download_url: https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip
  sha256: 572e36277c2390fbfde10664750731e0a86f55e33470d91919085f0408e67bfb
  expected_member: online_retail_II.xlsx
  expected_rows: 1067371
  expected_columns: [Invoice, StockCode, Description, Quantity, InvoiceDate, Price, Customer ID, Country]
  licence: CC BY 4.0
  attribution: "Online Retail II by Daqing Chen, UCI Machine Learning Repository, doi:10.24432/C5CG6D, CC BY 4.0"

cleaning:
  cancellation_prefix: "C"
  drop_missing_customer_id: true
  drop_exact_duplicates: true          # sensitivity run keeps them
  drop_price_le_zero: true
  drop_negative_qty_non_cancellation: true
  non_product_codes: [POST, DOT, M, C2, D, S, BANK CHARGES, AMAZONFEE, CRUK, B, PADS]
  non_product_prefixes: [ADJUST, TEST, gift_0001_]
  giant_line_qty: 5000                 # purchase lines this large are removed with the cancellation that exactly reverses them
  winsorise_quantile: 0.995            # fitted on the dev window only
  wholesale_units_per_line: 12         # profile flag and split for the wholesale-dominance fallback

windows:
  lookback_days: 273
  label_window_days: 90
  data_end: "2011-12-10"               # exclusive; last invoice is 2011-12-09
  snapshots:
    seasonal_2010: {cutoff: "2010-09-11", role: propensity_train}
    dev: {cutoff: "2011-03-15", role: segmentation_fit_and_propensity_train}
    val: {cutoff: "2011-06-13", role: selection_and_propensity_train}
    test: {cutoff: "2011-09-11", role: held_out_once}
  q4_months: [9, 10, 11, 12]           # label_window_q4 = 1 when the label window falls in these months

features:
  all:
    - recency_days
    - frequency_invoices
    - frequency_invoices_last_90d
    - monetary_net_gbp
    - avg_order_value_gbp
    - avg_lines_per_invoice
    - median_units_per_line
    - n_distinct_products
    - active_months
    - tenure_days
    - mean_interpurchase_days
    - single_invoice_flag
    - return_rate_value
    - is_uk
    - label_window_q4                  # propensity only, never a segmentation input
  # recency_days and tenure_days are not log-transformed: they are near-symmetric raw (owner decision 2026-11-04)
  log1p: [frequency_invoices, frequency_invoices_last_90d, monetary_net_gbp, avg_order_value_gbp,
          avg_lines_per_invoice, median_units_per_line, n_distinct_products, active_months,
          mean_interpurchase_days]
  segmentation_sets:
    A_rfm_core: [recency_days, frequency_invoices, monetary_net_gbp]
    # active_months dropped from B and C: rho 0.95 with frequency_invoices (owner decision 2026-11-04)
    B_behavioural_extended: [recency_days, frequency_invoices, monetary_net_gbp, avg_order_value_gbp,
                             median_units_per_line, n_distinct_products, return_rate_value]
    C_no_recency_sensitivity: [frequency_invoices, monetary_net_gbp, avg_order_value_gbp, median_units_per_line,
                               n_distinct_products, return_rate_value]

segmentation:
  k_range: [3, 8]
  n_init: 10
  min_segment_share: 0.05
  bootstrap_refits: 200
  selection_order: [ari_p05, silhouette]   # ties go to the smaller k
  ari_tie_tolerance: 0.0               # strict stability-first k choice (owner decision 2026-11-04; 0.02 picked k=6)
  stability_min: 0.70                  # S3 minimum useful (ari_p05)
  sensitivity:
    top_share_removed: 0.01            # refit without the top 1% of customers by dev monetary value
  gmm_stretch: {enabled: false, covariance_type: diag}
  set_selection_snapshot: val          # feature set A vs B chosen by segment-score AUC on this window
  sensitivity_set: C_no_recency_sensitivity

rfm_rule:
  quintiles: 5                         # cut points from the dev window; groups collapsed to the chosen k

propensity:
  logistic:
    penalty: l2
    C_grid: [0.01, 0.1, 1.0, 10.0]
    max_iter: 2000
  hist_gradient_boosting:
    max_depth: 3
    learning_rate: 0.05
    max_iter: 300
    early_stopping: true
  cv_folds: 5
  train_snapshots: [seasonal_2010, dev, val]

evaluation:
  bootstrap_resamples: 1000
  permutations: 200
  ci_level: 0.95
  min_events_per_fold: 50
  strong_margin: 0.10
  overfit_gap: 0.15

targets:
  S1_segment_score_auc: {no_skill: 0.50, minimum_useful: 0.685, stretch: 0.74}
  S2_segmentation_minus_rule_auc: {no_skill: 0.0, minimum_useful: "ci_low > 0", stretch: 0.02}
  S3_bootstrap_ari_p05: {no_skill: 0.0, minimum_useful: 0.70, stretch: 0.85}
  S4_segment_gain_over_recency_auc: {no_skill: 0.0, minimum_useful: "ci_low > 0", stretch: 0.05}
  S5_cramers_v: {no_skill: permuted_null_p95, minimum_useful: "> permuted_null_p95"}
  P1_propensity_auc: {no_skill: 0.50, minimum_useful: 0.725, stretch: 0.77}
  P2_calibration: {slope_range: [0.8, 1.2], max_abs_bias: 0.03, stretch_slope_range: [0.9, 1.1]}
  P3_brier_skill: {no_skill: 0.0, minimum_useful: "> 0"}
  P4_train_test_gap: {max: 0.15}

outcome:
  findings_requires: {S1_verdict: [STRONG, MODEST], S3_min: 0.70}
  decision_metric: S2                  # picks rule vs segmentation; does not change the mode

logging:
  level: INFO

engine:
  duckdb_threads: 1                    # parallel float aggregation is not bit-reproducible
